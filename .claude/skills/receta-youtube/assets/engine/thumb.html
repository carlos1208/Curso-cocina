<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Miniatura</title>
<style>
  @font-face { font-family: Fraunces; font-weight: 600; font-style: italic; src: url(fonts/fraunces-latin-600-italic.woff2) format('woff2'); }
  @font-face { font-family: Grotesk; font-weight: 700; src: url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
// YouTube thumbnail, 1280x720: the burger large on the left, a two-word title and three flavour tags that read at phone size
(async () => {
  // everything recipe-specific comes from timeline.json → thumb: {img, crop: [x, y, w] (0..1 of the photo), title: [l1, l2], tags: [[text, bg, fg]]}
  const TH = (await (await fetch('timeline.json')).json()).thumb;
  await Promise.all(['italic 600 100px Fraunces', '700 60px Grotesk'].map(f => document.fonts.load(f, 'Aá½ñ')));
  const im = new Image(); im.src = TH.img; await im.decode();
  const c = document.getElementById('c').getContext('2d'), W = 1280, H = 720;
  c.filter = 'blur(40px) brightness(.45) saturate(1.3)'; c.drawImage(im, -200, -500, 1700, 1700 * im.height / im.width); c.filter = 'none';
  const g = c.createRadialGradient(360, 380, 40, 360, 380, 700); g.addColorStop(0, 'rgba(242,181,68,.35)'); g.addColorStop(1, 'rgba(20,14,9,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // the dish, cropped into a tilted card
  c.save(); c.translate(372, 372); c.rotate(-3 * Math.PI / 180);
  const cw = 600, ch = 640; c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 50; c.shadowOffsetY = 20;
  c.fillStyle = '#0d0906'; c.beginPath(); c.roundRect(-cw / 2, -ch / 2, cw, ch, 28); c.fill(); c.shadowColor = 'transparent';
  c.save(); c.beginPath(); c.roundRect(-cw / 2, -ch / 2, cw, ch, 28); c.clip();
  const [cx0, cy0, cwr] = TH.crop || [0, .27, .74], sx = cx0 * im.width, sy = cy0 * im.height, sw = cwr * im.width, sh = sw * ch / cw;
  c.filter = 'contrast(1.12) saturate(1.2) brightness(1.06)'; c.drawImage(im, sx, sy, sw, sh, -cw / 2, -ch / 2, cw, ch); c.filter = 'none';
  c.restore(); c.strokeStyle = 'rgba(246,239,227,.9)'; c.lineWidth = 6; c.beginPath(); c.roundRect(-cw / 2, -ch / 2, cw, ch, 28); c.stroke();
  c.restore();
  // title: short uppercase line + a big italic word; both shrink to fit the right column
  const x = 700, fit = (txt, font, max) => { c.font = font; const w = c.measureText(txt).width; return Math.min(1, max / w); };
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 16; c.textBaseline = 'alphabetic';
  let k = fit(TH.title[0].toUpperCase(), '700 74px Grotesk', 540); c.fillStyle = '#F6EFE3'; c.font = `700 ${74 * k}px Grotesk`; c.fillText(TH.title[0].toUpperCase(), x, 250);
  k = fit(TH.title[1] || '', 'italic 600 150px Fraunces', 550); c.fillStyle = '#F2B544'; c.font = `italic 600 ${150 * k}px Fraunces`; c.fillText(TH.title[1] || '', x - 6, 390);
  c.shadowBlur = 0;
  let ty = 460; c.font = '700 40px Grotesk';
  (TH.tags || []).slice(0, 3).forEach(([t, bg, fg]) => { const w = c.measureText(t).width + 44; c.fillStyle = bg; c.beginPath(); c.roundRect(x, ty, w, 62, 31); c.fill(); c.fillStyle = fg; c.fillText(t, x + 22, ty + 45); ty += 76; });
  window.done = true;
})();
</script></body></html>
