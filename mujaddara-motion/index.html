// ─────────────────────────── partículas (semilla fija) ───────────────────────────
function disk(n, seed, rmax, extra) {
  const r = rng(seed), out = [];
  for (let i = 0; i < n; i++) {
    const th = r() * TAU, d = Math.sqrt(r()) * rmax;
    const p = { x: Math.cos(th) * d, y: Math.sin(th) * d, rot: r() * Math.PI, h: r(), h2: r(), f: .45 + .55 * r(), sh: Math.floor(r() * 3) };
    if (extra) Object.assign(p, extra(r, i));
    out.push(p);
  }
  return out;
}
const LENT = disk(520, 11, R * .93);
const RICE = disk(1150, 23, R * .95);
const ONI = disk(170, 37, R * .86, (r, i) => {
  const gt = r() * TAU, gd = Math.sqrt(r()) * R * .4;
  return { res: i % 2 === 1, ar: 13 + r() * 14, span: Math.PI * (.6 + .5 * r()), th: 7 + r() * 3,
    gx: Math.cos(gt) * gd, gy: Math.sin(gt) * gd - 10, bx: (r() - .5) * 250, by: (r() - .5) * 230 };
});

const SALT = disk(90, 61, R * .78);

const stirA = t => STIRS.reduce((a, [s, e, n]) => a + n * TAU * E.inOutSine(prog(t, s, e)), 0);

const cv = document.getElementById('c');

const BG = document.createElement('canvas'); BG.width = W; BG.height = H;
const MIXTEX = document.createElement('canvas'); MIXTEX.width = MIXTEX.height = R * 2;

// ─────────────────────────── texto ───────────────────────────
const F = {
  serif: (w, s) => `${w} ${s}px Fraunces, Georgia, serif`,
  serifI: s => `italic 400 ${s}px Fraunces, Georgia, serif`,
  sans: (w, s) => `${w} ${s}px Grotesk, 'Helvetica Neue', Arial, sans-serif`,
  mono: s => `700 ${s}px Mono, 'SFMono-Regular', Menlo, monospace`,

function text(str, x, y, font, color, align = 'left', ls = 0) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (HAS_LS) ctx.letterSpacing = ls + 'px';
  ctx.fillText(str, x, y);
  if (HAS_LS) ctx.letterSpacing = '0px';
}
function fitSize(lines, fontFn, max, maxW) {
  let s = max;
  ctx.font = fontFn(max);
  if (HAS_LS) ctx.letterSpacing = '0px';
  for (const l of lines) { const w = ctx.measureText(l).width; if (w > maxW) s = Math.min(s, Math.floor(max * maxW / w)); }
  return s;
}

// ─────────────────────────── primitivas ───────────────────────────
const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); };

function drawFlames(t, heat) {
  if (heat <= .01) return;
  const g = ctx.createRadialGradient(0, 0, R, 0, 0, R + 150);
  g.addColorStop(0, `rgba(255,140,50,${.3 * heat})`); g.addColorStop(1, 'rgba(255,140,50,0)');
  ctx.fillStyle = g; circle(0, 0, R + 150); ctx.fill();
  const n = 30;
  for (let i = 0; i < n; i++) {
    const ang = i / n * TAU + .05;
    const flick = .78 + .22 * Math.sin(t * 23 + i * 1.7) * Math.sin(t * 7.3 + i * 3.1);
    const len = (22 + 44 * heat) * flick, wd = 8 + 3 * heat;
    ctx.save(); ctx.rotate(ang); ctx.translate(R + 20, 0);
    const fg = ctx.createLinearGradient(0, 0, len, 0);
    fg.addColorStop(0, 'rgba(60,105,245,.9)'); fg.addColorStop(.55, 'rgba(120,165,255,.75)'); fg.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(0, -wd); ctx.quadraticCurveTo(len * .55, -wd * .8, len, 0); ctx.quadraticCurveTo(len * .55, wd * .8, 0, wd); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

  let g = ctx.createLinearGradient(-R, -R, R, R);

}

function drawBowl(b, s, a, fill, fillA) {

function drawCup(x, y, ang, tilt, col, liquid, amount, a) {

  shadow(34, 18, .3);
  ctx.fillStyle = '#F9F6EF';
  ctx.beginPath(); ctx.roundRect(-150, -15, 96, 30, 15); ctx.fill();
  ctx.scale(1 - .2 * tilt, 1);
  circle(0, 0, 62); ctx.fill();
  ctx.beginPath(); ctx.moveTo(52, -16); ctx.lineTo(76, 0); ctx.lineTo(52, 16); ctx.fill();
  noShadow();
  ctx.fillStyle = '#E9E1D2'; circle(0, 0, 52); ctx.fill();

    const rr = 47 * Math.sqrt(amount), ox = (47 - rr) * .6 + 8 * tilt;
    ctx.fillStyle = liquid ? rgba(col, .85) : col;
    ctx.beginPath(); ctx.ellipse(ox, 0, rr, rr * .96, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = liquid ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.18)';

    else for (let k = 0; k < 18; k++) {

      ctx.beginPath(); ctx.ellipse(ox + Math.cos(th) * d, Math.sin(th) * d, 4, 3, th, 0, TAU); ctx.fill();

}
function drawMeasureSpoon(x, y, ang, col, amount, a) {

function drawStream(x0, y0, x1, y1, col, w) {

  ctx.strokeStyle = rgba(col, .9); ctx.lineWidth = 15 * w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 - 20, x1, y1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 4 * w;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 3); ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 - 24, x1, y1 - 3); ctx.stroke();
  ctx.restore();
}
function ripples(x, y, t, t0, t1, col) {
  if (t < t0 || t > t1 + .8) return;
  ctx.save(); ctx.strokeStyle = col;
  for (let k = 0; k < 4; k++) {
    const u = ((t - t0) * 1.6 + k / 4) % 1;
    if (t - t0 < k / 4 / 1.6 || (t > t1 && (t - t1) * 1.6 > u)) continue;
    ctx.globalAlpha = (1 - u) * .7; ctx.lineWidth = 3 * (1 - u) + 1;
    ctx.beginPath(); ctx.ellipse(x, y, 16 + u * 110, 12 + u * 85, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function bubbles(t, amt, n, rmin, rmax, seed) {
  if (amt <= .02) return;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
  for (let k = 0; k < n; k++) {
    const per = .45 + hash(k + seed) * .6, ph = hash(k * 2.3 + seed) * per;
    const cyc = Math.floor((t + ph) / per), u = (t + ph) / per - cyc;
    const th = hash(k * 5.1 + cyc * 1.7 + seed) * TAU, d = Math.sqrt(hash(k * 9.3 + cyc * 3.3 + seed)) * R * .9;
    ctx.globalAlpha = amt * (1 - u) * .55;
    circle(Math.cos(th) * d, Math.sin(th) * d, rmin + (rmax - rmin) * u); ctx.stroke();
  }
  ctx.restore();
}
function drawSteam(t, amt, ox, oy, spread, seed = 0) {
  if (amt <= .01) return;
  for (let k = 0; k < 14; k++) {
    const per = 2 + hash(k + seed) * 1.2, ph = hash(k * 4.7 + seed) * per;
    const u = ((t + ph) / per) % 1;
    const x = ox + (hash(k * 1.9 + seed) - .5) * spread + Math.sin(u * 3 + k) * 34;
    const y = oy - u * 300 + (hash(k * 6.1 + seed) - .5) * spread * .5;
    const r = 50 + 130 * u, a = amt * Math.sin(Math.PI * u) * .2;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; circle(x, y, r); ctx.fill();

// Tabla de cortar + cebolla en juliana + cuchillo
const CUTS = 8, OX = -20, OR = 125, CX0 = OX - OR, CW = OR * 2 / CUTS;
function onionSection(x0, x1, shift) {
  ctx.save(); ctx.translate(shift, 0);
  ctx.beginPath(); ctx.rect(x0, -OR - 5, x1 - x0, OR * 2 + 10); ctx.clip();
  circle(OX, 0, OR); ctx.clip();
  ctx.fillStyle = '#F5EFDD'; ctx.fillRect(OX - OR, -OR, OR * 2, OR * 2);
  ctx.strokeStyle = 'rgba(196,172,118,.55)'; ctx.lineWidth = 2.5;
  for (let k = 1; k <= 6; k++) { circle(OX + 6, 4, OR * k / 6.6); ctx.stroke(); }
  ctx.strokeStyle = '#C98B45'; ctx.lineWidth = 7; circle(OX, 0, OR - 3); ctx.stroke();
  ctx.restore();
}
function drawBoard(t) {
  const bi = E.outCubic(prog(t, 8.2, 8.5)), bo = E.inCubic(prog(t, 9.5, 9.85));
  if (bi <= 0 || bo >= 1) return;
  ctx.save(); ctx.translate((1 - bi) * 950 - bo * 950, 0); ctx.rotate(-.05 + (1 - bi) * .15);
  shadow(60, 30, .35);
  ctx.fillStyle = '#C69A69'; ctx.beginPath(); ctx.roundRect(-350, -225, 700, 450, 36); ctx.fill(); noShadow();
  const g = ctx.createLinearGradient(-350, -225, 350, 225); g.addColorStop(0, '#D6AC7C'); g.addColorStop(1, '#BB8C59');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-350, -225, 700, 450, 36); ctx.fill();
  ctx.strokeStyle = 'rgba(120,70,30,.13)'; ctx.lineWidth = 2;
  for (let k = 0; k < 16; k++) {
    const y = -200 + k * 27;
    ctx.beginPath(); for (let x = -330; x <= 330; x += 30) { const yy = y + Math.sin(x * .012 + k * 1.3) * 5; x === -330 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); } ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(90,50,20,.12)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(-326, -201, 652, 402, 24); ctx.stroke();

  if (t < 9.56) {
    const q = prog(t, 8.65, 9.45) * CUTS, cut = Math.floor(q);
    if (t < 8.63) {       // cebolla entera, vista cenital
      ctx.save(); shadow(24, 12, .3);
      const og = ctx.createRadialGradient(OX - 40, -40, 10, OX, 0, OR);
      og.addColorStop(0, '#E6B06A'); og.addColorStop(1, '#A9632A');
      ctx.fillStyle = og; circle(OX, 0, OR); ctx.fill(); noShadow();
      ctx.strokeStyle = 'rgba(100,50,15,.28)'; ctx.lineWidth = 2;
      for (let k = 0; k < 12; k++) { const a0 = k / 12 * TAU; ctx.beginPath(); ctx.moveTo(OX, 0); ctx.quadraticCurveTo(OX + Math.cos(a0 + .3) * OR * .6, Math.sin(a0 + .3) * OR * .6, OX + Math.cos(a0) * OR, Math.sin(a0) * OR); ctx.stroke(); }
      ctx.fillStyle = '#7A4217'; circle(OX, 0, 10); ctx.fill();
      ctx.restore();
    } else {
      ctx.save(); shadow(14, 6, .22);
      for (let j = 0; j < CUTS; j++) {
        const x0 = CX0 + j * CW, x1 = x0 + CW;
        if (j < cut) onionSection(x0, x1, -(cut - j) * 5 - 6);
      }
      onionSection(CX0 + cut * CW, OX + OR + 5, 0);
      ctx.restore();
    }
    // cuchillo
    const kin = prog(t, 8.5, 8.65), kout = prog(t, 9.45, 9.56);
    if (kin > 0 && kout < 1) {
      const f = q - cut, press = cut < CUTS ? 1 - Math.sin(Math.PI * f) : 1;
      const kx = CX0 + Math.min(CUTS, cut + E.inOutCubic(f)) * CW;
      ctx.save(); ctx.globalAlpha = kin * (1 - kout);
      ctx.translate(kx + (1 - kin) * 200 + kout * 200, 20); ctx.rotate(.07);
      const lift = 1 - press; ctx.scale(1 + lift * .05, 1 + lift * .05);
      shadow(18 + lift * 30, 8 + lift * 22, .35);
      const kg = ctx.createLinearGradient(-6, 0, 50, 0); kg.addColorStop(0, '#F3F5F7'); kg.addColorStop(1, '#A7AFB6');
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.moveTo(0, 120); ctx.lineTo(0, -250); ctx.quadraticCurveTo(10, -262, 30, -200); ctx.lineTo(52, 120); ctx.closePath(); ctx.fill();
      noShadow();
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1, 118); ctx.lineTo(1, -246); ctx.stroke();
      ctx.fillStyle = '#2E2622'; ctx.beginPath(); ctx.roundRect(4, 118, 44, 170, 14); ctx.fill();
      ctx.fillStyle = '#B9BEC2'; for (const yy of [160, 205, 250]) { circle(26, yy, 5); ctx.fill(); }
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawStirSpoon(t) {
  let vis = 0;
  for (const [s, e] of STIRS) vis = Math.max(vis, prog(t, s - .18, s) * (1 - prog(t, e, e + .18)));
  if (vis <= 0) return;
  const ang = stirA(t) * .95 + .7, d = R * .48;
  ctx.save(); ctx.globalAlpha = vis; ctx.rotate(ang); ctx.translate(d, 0);
  shadow(26, 16, .35);
  ctx.fillStyle = '#C08A55';
  ctx.beginPath(); ctx.moveTo(30, -11); ctx.lineTo(380, -8); ctx.quadraticCurveTo(392, 0, 380, 8); ctx.lineTo(30, 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#CF9D66'; ctx.beginPath(); ctx.ellipse(0, 0, 48, 35, 0, 0, TAU); ctx.fill(); noShadow();
  ctx.fillStyle = 'rgba(120,70,30,.25)'; ctx.beginPath(); ctx.ellipse(-3, 0, 36, 25, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawFork(t) {
  const a = prog(t, 22.2, 22.4) * (1 - prog(t, 23.7, 23.9));
  if (a <= 0) return;
  const u = prog(t, 22.35, 23.75) * 3, k = Math.min(2, Math.floor(u)), v = E.inOutSine(u - k);
  const dir = k % 2 ? -1 : 1;
  const x = lerp(-190 * dir, 190 * dir, v), y = -120 + k * 115;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(-.9 + dir * .12);
  shadow(20, 14, .35);
  const g = ctx.createLinearGradient(0, -20, 0, 20); g.addColorStop(0, '#F2F4F6'); g.addColorStop(1, '#9FA7AE');
  ctx.fillStyle = g;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.roundRect(-70, -21 + i * 12, 70, 6, 3); ctx.fill(); }
  ctx.beginPath(); ctx.roundRect(-8, -24, 40, 48, 16); ctx.fill();
  ctx.beginPath(); ctx.moveTo(28, -10); ctx.lineTo(300, -12); ctx.quadraticCurveTo(312, 0, 300, 12); ctx.lineTo(28, 10); ctx.fill();
  ctx.restore();
}
function drawLid(t) {
  const li = E.outCubic(prog(t, 17.2, 17.8)), lo = E.inOutCubic(prog(t, 20.3, 20.9));
  if (li <= 0 || lo >= 1) return;
  const x = (1 - li) * 700 - lo * 760, y = (1 - li) * -520 - lo * 420, rot = (1 - li) * .6 - lo * .5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  shadow(50, 26, .28);
  ctx.fillStyle = 'rgba(225,235,238,.22)'; circle(0, 0, R + 38); ctx.fill(); noShadow();
  const g = ctx.createRadialGradient(-R * .3, -R * .3, 20, 0, 0, R + 38);

  }

  ctx.strokeStyle = rg; ctx.lineWidth = 16; circle(0, 0, R + 32); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, R * .78, Math.PI * 1.1, Math.PI * 1.38); ctx.stroke();
  ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, R * .68, Math.PI * 1.15, Math.PI * 1.3); ctx.stroke();
  shadow(16, 8, .35); ctx.fillStyle = '#2B2521'; circle(0, 0, 42); ctx.fill(); noShadow();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 34, Math.PI * 1.05, Math.PI * 1.6); ctx.stroke();
  ctx.restore();
}
function drawYogurt(t) {
  const a = E.outCubic(prog(t, 26.9, 27.45));

  ctx.save(); ctx.translate((1 - a) * 420, (1 - a) * 60);

  ctx.fillStyle = '#FCFAF4'; circle(YB.x, YB.y, YB.r * .74); ctx.fill();
  ctx.strokeStyle = 'rgba(150,130,100,.18)'; ctx.lineWidth = 3;
  ctx.beginPath(); for (let i = 0; i <= 60; i++) { const th = i / 60 * TAU * 1.6, r = 8 + i * .8; const X = YB.x + Math.cos(th) * r, Y = YB.y + Math.sin(th) * r; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.stroke();
  ctx.fillStyle = 'rgba(212,160,50,.85)';
  for (let k = 0; k < 6; k++) { const th = hash(k * 3.7) * TAU, d = 14 + hash(k * 5.3) * 38; circle(YB.x + Math.cos(th) * d, YB.y + Math.sin(th) * d, 3 + hash(k) * 4); ctx.fill(); }
  ctx.fillStyle = '#A33A26';
  for (let k = 0; k < 24; k++) { const th = hash(k * 8.1) * TAU, d = hash(k * 2.9) * 22; circle(YB.x + 6 + Math.cos(th) * d, YB.y - 4 + Math.sin(th) * d, 1.8); ctx.fill(); }

// ─────────────────────────── partículas por frame ───────────────────────────
function makeBuckets() { return { rice1: new Map(), pot: new Map(), rice2: new Map(), dust: new Map(), bowl: new Map(), top: new Map() }; }
function push(bk, layer, col, x, y, rx, ry, rot) {
  const m = bk[layer]; let arr = m.get(col); if (!arr) m.set(col, arr = []); arr.push(x, y, rx, ry, rot);
}
function flushBucket(m) {
  for (const [col, a] of m) {
    ctx.fillStyle = col; ctx.beginPath();
    for (let i = 0; i < a.length; i += 5) { ctx.moveTo(a[i] + a[i + 2], a[i + 1]); ctx.ellipse(a[i], a[i + 1], a[i + 2], a[i + 3], a[i + 4], 0, TAU); }
    ctx.fill();
  }
}
const cupSpout = (tilt) => [CUP.x + Math.cos(CUP_ANG) * 62 * (1 - .2 * tilt), CUP.y + Math.sin(CUP_ANG) * 62];

function collect(t, bk, oni) {
  const th = stirA(t), w1 = water1(t), fl = prog(t, 22.3, 23.8);
  const cooked = prog(t, 17.9, 20.2);
  const [sx, sy] = cupSpout(1);
  const boil = heatAt(t) > .8 ? 1 : 0;

  // lentejas
  for (const p of LENT) {
    const ti = 3.35 + p.h * .45, td = 6.45 + p.h2 * .5, tr = 15.65 + p.h * .45;
    if (t < ti) continue;
    let [px, py] = rotP(p.x, p.y, th * p.f);
    if (t < 7.3) { px += Math.sin(t * 1.6 + p.h * 30) * 3 * w1 + Math.sin(t * 11 + p.h2 * 40) * 1.6 * w1 * boil; py += Math.cos(t * 1.3 + p.h2 * 30) * 3 * w1; }
    px += (p.h - .5) * 9 * fl; py += (p.h2 - .5) * 9 * fl;
    const bx = B1.x + p.x * (B1.r * .72 / R), by = B1.y + p.y * (B1.r * .72 / R);
    const col = LENT_COL[p.sh], plump = 1 + .1 * cooked;
    let x, y, s, layer;
    if (t < ti + .35) { const u = prog(t, ti, ti + .35), e = E.outCubic(u); x = lerp(sx + (p.h2 - .5) * 20, px, e); y = lerp(sy + (p.h - .5) * 20, py, e); s = lerp(1.6, 1, E.inQuad(u)); layer = 'top'; }
    else if (t < td) { x = px; y = py; s = 1; layer = 'pot'; }
    else if (t < td + .4) { const u = prog(t, td, td + .4), e = E.inOutCubic(u); x = lerp(px, bx, e); y = lerp(py, by, e); s = lerp(1, .8, u) * (1 + .4 * Math.sin(Math.PI * u)); layer = 'top'; }
    else if (t < tr) { x = bx; y = by; s = .8; layer = 'bowl'; }
    else if (t < tr + .4) { const u = prog(t, tr, tr + .4), e = E.inOutCubic(u); x = lerp(bx, px, e); y = lerp(by, py, e); s = lerp(.8, 1, u) * (1 + .4 * Math.sin(Math.PI * u)); layer = 'top'; }
    else { x = px; y = py; s = plump; layer = 'pot'; }
    push(bk, layer, col, x, y, 8.4 * s, 6.8 * s, p.rot);
    if (layer === 'pot') push(bk, layer, 'rgba(255,236,200,.22)', x - 2.2 * s, y - 2 * s, 3 * s, 2 * s, p.rot);
  }

  // arroz
  const riceCol = RICE_RAW.map((c, i) => mix(c, RICE_COOKED[i], cooked));
  const sw = 1 + .22 * cooked;
  for (let i = 0; i < RICE.length; i++) {
    const p = RICE[i], ti = 13.2 + p.h * .4;
    if (t < ti) continue;
    let [px, py] = rotP(p.x, p.y, th * p.f);
    px += (p.h - .5) * 9 * fl; py += (p.h2 - .5) * 9 * fl;
    let x = px, y = py, s = sw, layer = 'pot';
    if (t < ti + .3) { const u = prog(t, ti, ti + .3), e = E.outCubic(u); x = lerp(sx + (p.h2 - .5) * 20, px, e); y = lerp(sy + (p.h - .5) * 20, py, e); s = lerp(1.6, 1, E.inQuad(u)); layer = 'top'; }
    push(bk, layer === 'pot' ? (i < 600 ? 'rice1' : 'rice2') : layer, riceCol[p.sh], x, y, 10.5 * s, 3.9 * s, p.rot + th * p.f);
  }

  // cebolla (arcos, se dibujan aparte)
  const kCar = prog(t, 9.9, 12.2), crisp = prog(t, 23.8, 25);
  for (const p of ONI) {
    const tb = 9.55 + p.h * .45;
    if (t < tb) continue;
    let [px, py] = rotP(p.x, p.y, th * p.f);
    const col0 = ramp(ONION, kCar);
    const shrink = 1 - .22 * kCar;
    let x, y, s, layer, col = col0;
    if (t < tb + .4) { const u = prog(t, tb, tb + .4), e = E.inOutCubic(u); x = lerp(p.bx, px, e); y = lerp(p.by, py, e); s = lerp(1.15, 1, u); layer = 'top'; }
    else if (!p.res) { x = px; y = py; s = 1; layer = 'pot'; }
    else {
      const tr = 12.3 + p.h * .4, tg = 25.15 + p.h * .55;
      const bx = B2.x + p.x * (B2.r * .7 / R), by = B2.y + p.y * (B2.r * .7 / R);
      col = mix(col0, '#5A2A0F', crisp);
      if (t < tr) { x = px; y = py; s = 1; layer = 'pot'; }
      else if (t < tr + .4) { const u = prog(t, tr, tr + .4), e = E.inOutCubic(u); x = lerp(px, bx, e); y = lerp(py, by, e); s = lerp(1, .55, u) * (1 + .35 * Math.sin(Math.PI * u)); layer = 'top'; }
      else if (t < tg) { x = bx; y = by; s = .55; layer = 'bowl'; }
      else if (t < tg + .45) { const u = prog(t, tg, tg + .45), e = E.inOutCubic(u); x = lerp(bx, p.gx, e); y = lerp(by, p.gy, e); s = lerp(.55, 1, u) * (1 + .5 * Math.sin(Math.PI * u)); layer = 'top'; }
      else { x = p.gx; y = p.gy; s = 1; layer = 'garnish'; }
    }
    oni.push({ x, y, s: s * shrink, col, p, layer, rot: p.rot * 2 + (layer === 'pot' ? th * p.f : 0) });
  }

  // comino, sal
  const cumA = 1 - prog(t, 16.6, 17.3), saltA = 1 - prog(t, 15.5, 16.3);
  sprinkle(t, bk, CUMIN, 14.2, 14.65, cumA, '#7A4A22', 2.8, 2.3, th);
  sprinkle(t, bk, SALT, 15.0, 15.45, saltA, '#FFFFFF', 2.4, 2.4, th);
}
function sprinkle(t, bk, arr, pa, pb, alpha, col, rx, ry, th) {
  if (t < pa || alpha <= 0) return;
  const q = Math.round(alpha * 20) / 20, c = rgba(col, q);
  for (const p of arr) {
    const ti = pa + p.h * (pb - pa - .25);
    if (t < ti) continue;
    let [px, py] = rotP(p.x, p.y, th * p.f);
    if (t < ti + .25) {
      const u = prog(t, ti, ti + .25), e = E.outCubic(u), s = lerp(2.2, 1, E.inQuad(u));
      push(bk, 'top', c, lerp(SPOON.x, px, e), lerp(SPOON.y, py, e), rx * s, ry * s, p.rot);
    } else push(bk, 'dust', c, px, py, rx, ry, p.rot);
  }
}
function drawOnions(list, layer) {
  ctx.save(); ctx.lineCap = 'round';
  for (const o of list) {
    if (o.layer !== layer) continue;
    const p = o.p, big = layer === 'garnish' ? 1.25 : 1, r = p.ar * o.s * big;
    ctx.strokeStyle = o.col; ctx.lineWidth = p.th * Math.max(.6, o.s) * big;
    ctx.beginPath(); ctx.arc(o.x, o.y, r, o.rot, o.rot + p.span); ctx.stroke();
    ctx.strokeStyle = mix(o.col, '#FFF4DC', layer === 'garnish' ? .32 : .4); ctx.lineWidth = p.th * Math.max(.6, o.s) * big * .32;
    ctx.beginPath(); ctx.arc(o.x, o.y, r - p.th * o.s * .18, o.rot + .15, o.rot + p.span - .15); ctx.stroke();
  }
  ctx.restore();
}
function drawParsley(t, th) {
  if (t < 26.15) return;
  for (const p of PARS) {
    const ti = 26.15 + p.h * .3;
    if (t < ti) continue;
    const u = prog(t, ti, ti + .25), e = E.outCubic(u), s = lerp(2.2, 1, E.inQuad(u));
    const x = lerp(SPOON.x, p.x, e), y = lerp(SPOON.y, p.y - 10, e);
    ctx.fillStyle = PARS_COL[p.sh];
    ctx.beginPath(); ctx.ellipse(x, y, 7.5 * s, 3.4 * s, p.rot, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + Math.cos(p.rot + 1.2) * 5 * s, y + Math.sin(p.rot + 1.2) * 5 * s, 6 * s, 3 * s, p.rot + 1.2, 0, TAU); ctx.fill();
  }
}

// líquidos
const water1 = t => prog(t, 4.4, 4.9) * (1 - prog(t, 6.45, 6.95));
const water2 = t => prog(t, 16.35, 16.9) * (1 - prog(t, 17.9, 20.2));
function drawLiquid(t, a, pa, pb, inner, outer, spread, k = 1) {
  if (a <= 0) return;
  const rr = R * spread * E.outCubic(prog(t, pa, pb + .3));
  const cx = lerp(LAND.x, 0, prog(t, pa, pb + .5)), cy = lerp(LAND.y, 0, prog(t, pa, pb + .5));
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, rr));
  g.addColorStop(0, rgba(inner, .5 * a * k)); g.addColorStop(.85, rgba(outer, .6 * a * k)); g.addColorStop(1, rgba(outer, .66 * a * k));
  ctx.fillStyle = g; circle(cx, cy, rr); ctx.fill();
}
function glints(t, amt, n, seed) {
  if (amt <= 0) return;
  for (let k = 0; k < n; k++) {
    const per = .7 + hash(k + seed) * .9, u = ((t + hash(k * 3 + seed) * per) / per) % 1, cyc = Math.floor((t + hash(k * 3 + seed) * per) / per);
    const th = hash(k * 7.7 + cyc + seed) * TAU, d = Math.sqrt(hash(k * 1.3 + cyc * 2.1 + seed)) * R * .75;
    const a = amt * Math.sin(Math.PI * u), x = Math.cos(th) * d, y = Math.sin(th) * d;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 16);
    g.addColorStop(0, `rgba(255,250,225,${a})`); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; circle(x, y, 16); ctx.fill();
  }
}

// ─────────────────────────── escenario ───────────────────────────
function drawStage(t) {
  const heat = heatAt(t);
  const plateA = E.inOutSine(prog(t, 24.0, 24.7)), potA = 1 - plateA;
  let s = lerp(.9, 1, E.outCubic(prog(t, 0, 1.1)));
  s *= 1 + .012 * Math.sin(t * .45);
  s *= 1 + .05 * E.inOutSine(prog(t, 8.2, 8.6)) * (1 - E.inOutSine(prog(t, 9.5, 9.9)));
  s *= 1 + .05 * E.inOutSine(prog(t, 27.6, 30));
  const rot = -.14 * Math.sin(Math.PI * E.inOutSine(prog(t, 23.9, 25.2)));
  const introA = prog(t, 0, .6);

  ctx.save(); ctx.translate(PX, PY); ctx.scale(s, s); ctx.globalAlpha = introA;
  drawFlames(t, heat * potA);
  ctx.save(); ctx.rotate(rot);
  drawPot(potA); drawPlate(plateA);

  const bk = makeBuckets(), oni = [];
  if (t >= 3.3) collect(t, bk, oni);
  const th = stirA(t);

  // contenido de la olla (recortado al interior)
  ctx.save(); circle(0, 0, R); ctx.clip();
  const oilA = prog(t, 7.5, 8.0) * (1 - .75 * prog(t, 13.2, 14.5));
  drawLiquid(t, oilA, 7.45, 7.95, '#F6D775', '#D9A33A', 1.25, 1.3);
  glints(t, oilA * (heat > .3 ? 1 : .5) * (1 - prog(t, 9.6, 10.4) * .6), 16, 3);
  const mixA = .45 * prog(t, 13.3, 14.6) + .55 * prog(t, 17.8, 20.3);
  if (mixA > 0) { ctx.save(); ctx.globalAlpha = mixA; ctx.rotate(th * .6); ctx.drawImage(MIXTEX, -R, -R); ctx.restore(); }
  drawOnions(oni, 'pot');
  flushBucket(bk.rice1); flushBucket(bk.pot); flushBucket(bk.rice2); flushBucket(bk.dust);
  drawLiquid(t, water1(t), 4.4, 4.9, '#B4D0D6', '#7FA3AE', 2.2);
  drawLiquid(t, water2(t), 16.35, 16.9, '#B9CFCF', '#8FA9A8', 2.2);
  const boilAmt = Math.max(water1(t), water2(t)) * clamp((heat - .5) * 2);
  bubbles(t, boilAmt, 55, 5, 17, 1);
  bubbles(t, oilA * clamp((heat - .3) * 3) * (t < 13.3 ? 1 : 0), 40, 2, 6, 7);
  potInnerShade(potA);
  ctx.restore();

  // cuencos de reserva
  const b1s = E.outBack(prog(t, 6.3, 6.6)) * (1 - E.inCubic(prog(t, 16.15, 16.45)));
  const b2s = E.outBack(prog(t, 12.05, 12.35)) * (1 - E.inCubic(prog(t, 25.8, 26.15)));
  drawBowl(B1, b1s, 1, '#4E3B25', prog(t, 6.6, 7.1) * (1 - prog(t, 15.7, 16.2)));
  drawBowl(B2, b2s, 1, '#6B3616', prog(t, 12.4, 12.8) * (1 - prog(t, 25.2, 25.8)));
  bowlLabel(B1, S.bowls[0], b1s);
  bowlLabel(B2, S.bowls[1], b2s);
  flushBucket(bk.bowl);
  drawOnions(oni, 'bowl');

  drawYogurt(t);
  drawOnions(oni, 'garnish');
  drawParsley(t, th);
  flushBucket(bk.top);
  drawOnions(oni, 'top');

  drawBoard(t);
  drawStirSpoon(t);
  drawFork(t);
  drawLid(t);
  ctx.restore();   // rotación

  // vapor
  drawSteam(t, prog(t, 5.3, 5.8) * (1 - prog(t, 6.3, 6.8)) * .7, 0, 0, 380, 0);
  drawSteam(t, prog(t, 18.0, 18.6) * (1 - prog(t, 20.2, 20.4)) * .7, 0, -20, 90, 20);
  drawSteam(t, prog(t, 20.4, 20.9) * (1 - .5 * prog(t, 24, 26)), 0, 0, 420, 40);

  // recipientes que vierten
  for (const P of POURS) {
    if (t < P.a || t > P.b) continue;
    const ein = E.outCubic(prog(t, P.a, P.a + .3)), eout = E.inCubic(prog(t, P.b - .3, P.b));
    const tilt = E.inOutSine(prog(t, P.pa - .15, P.pa + .05)) * (1 - E.inOutSine(prog(t, P.pb, P.pb + .2)));
    const off = (1 - ein) * 360 + eout * 360;
    const flow = prog(t, P.pa, P.pa + .08) * (1 - prog(t, P.pb - .08, P.pb));
    const [spx, spy] = cupSpout(tilt);
    if (P.liquid) { drawStream(spx, spy, LAND.x, LAND.y, P.col, flow); ripples(LAND.x, LAND.y, t, P.pa, P.pb, 'rgba(255,255,255,.8)'); }
    drawCup(CUP.x + off, CUP.y - off * .15, CUP_ANG, tilt, P.col, P.liquid, 1 - prog(t, P.pa, P.pb), 1);
  }
  for (const [a, b, pa, pb, col] of [[14.0, 14.85, 14.2, 14.65, '#8A5A2B'], [14.8, 15.6, 15.0, 15.45, '#FFFFFF'], [26.0, 26.9, 26.15, 26.7, '#5B8A32']]) {
    if (t < a || t > b) continue;
    const ein = E.outCubic(prog(t, a, a + .25)), eout = E.inCubic(prog(t, b - .25, b));
    const shake = Math.sin(t * 42) * .12 * prog(t, pa, pa + .05) * (1 - prog(t, pb, pb + .05));
    const off = (1 - ein) * 420 + eout * 420;
    drawMeasureSpoon(SPOON.x + off * .7, SPOON.y - off * .7, Math.atan2(-SPOON.y, -SPOON.x) + shake, col, 1 - prog(t, pa, pb), 1);
  }
  ctx.restore();
}
function bowlLabel(b, str, s) {
  if (s <= .05) return;
  ctx.save(); ctx.globalAlpha = clamp(s);
  text(str, b.x, b.y + b.r + 42, F.mono(19), C.muted, 'center', 3);
  ctx.restore();
}

// ─────────────────────────── HUD ───────────────────────────
function drawHeader(t) {
  if (t < 2.95 || t > 28.1) return;

  ctx.save(); ctx.globalAlpha = A;
  ctx.strokeStyle = C.faint; ctx.lineWidth = 2;
  const lw = 900 * E.outExpo(prog(t, 3.0, 3.8));

  text('MUJADDARA', 990, 150, F.mono(22), C.muted, 'right', 4);

  for (let i = 0; i < STEPS.length; i++) {
    const [a, b] = STEPS[i];
    if (t < a || t > b) continue;
    const ein = E.outExpo(prog(t, a, a + .6)), eout = E.inCubic(prog(t, b - .28, b));
    ctx.save(); ctx.globalAlpha = A * (1 - eout);
    text(`${S.step} ${String(i + 1).padStart(2, '0')} / ${String(STEPS.length).padStart(2, '0')}`, 90 - (1 - ein) * 30, 150, F.mono(24), C.accent, 'left', 4);
    ctx.beginPath(); ctx.rect(80, 168, 930, 100); ctx.clip();
    const fs = fitSize([S.steps[i]], s => F.serif(600, s), 72, 900);
    text(S.steps[i], 88, 245 + (1 - ein) * 95 - eout * 60, F.serif(600, fs), C.ink);
    ctx.restore();
  }
}
function drawCards(t) {
  const cards = S.cards;
  for (let i = 0; i < cards.length; i++) {
    const [t0, kind, name, qty, note, n, col] = cards[i];
    const t1 = i + 1 < cards.length ? cards[i + 1][0] : 27.85;
    if (t < t0 || t >= t1) continue;
    const eout = E.inCubic(prog(t, t1 - .22, t1));
    const ing = kind === 'i';
    ctx.save(); ctx.globalAlpha = 1 - eout; ctx.translate(0, -eout * 34);
    // etiqueta
    const la = E.outCubic(prog(t, t0, t0 + .3));
    ctx.save(); ctx.globalAlpha *= la;
    const sw = E.outBack(prog(t, t0, t0 + .4));
    if (ing) {
      ctx.fillStyle = col; circle(101, 1384, 11 * sw); ctx.fill();
      ctx.strokeStyle = 'rgba(34,26,19,.3)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.strokeStyle = C.accent; ctx.lineWidth = 3; circle(101, 1384, 9 * sw); ctx.stroke();
    }
    const label = ing ? `${S.ingr} ${String(n).padStart(2, '0')}/${String(N_INGR).padStart(2, '0')}${note ? '  ·  ' + note : ''}` : S.tech;
    const lfs = fitSize([label], F.mono, 24, 640);
    text(label, 126 - (1 - la) * 20, 1393, F.mono(lfs), C.accent, 'left', 3);
    ctx.restore();
    // nombre
    const lines = name.split('\n');
    const fs = fitSize(lines, s => F.sans(700, s), 118, 660);
    let base = 1432 + fs * .74;
    lines.forEach((l, k) => {
      const e = E.outExpo(prog(t, t0 + .05 + k * .07, t0 + .6 + k * .07));
      ctx.save(); ctx.beginPath(); ctx.rect(80, base - fs * .9, 760, fs * 1.08); ctx.clip();
      text(l, 86, base + (1 - e) * fs, F.sans(700, fs), C.ink, 'left', -1);
      ctx.restore();
      if (k < lines.length - 1) base += fs * .93;
    });
    // cantidad
    const e2 = E.outCubic(prog(t, t0 + .18, t0 + .62));
    ctx.save(); ctx.globalAlpha *= e2;
    const qfs = fitSize([qty], F.serifI, 70, 660);
    text(qty, 90, base + 86 + (1 - e2) * 26, F.serifI(qfs), ing ? C.accent : C.muted);
    ctx.restore();
    ctx.restore();
  }
}
function flameIcon(x, y, s, on) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = on ? C.accent : 'rgba(34,26,19,.16)';
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.bezierCurveTo(9, -4, 10, 4, 0, 10); ctx.bezierCurveTo(-10, 4, -9, -4, 0, -14); ctx.fill();
  ctx.restore();
}
function drawTimerWidget(t) {
  const cx = 880, cy = 1478, heat = heatAt(t);
  let tm = null, vis = 0;
  for (const T of TIMERS) {
    const v = E.outBack(prog(t, T.a - .3, T.a)) * (1 - E.inCubic(prog(t, T.b, T.b + .35)));
    if (v > vis) { vis = v; tm = T; }
  }
  if (tm && vis > 0) {
    const p = E.inOutSine(prog(t, tm.a, tm.b));
    ctx.save(); ctx.translate(cx, cy); ctx.scale(vis, vis);
    shadow(40, 16, .18); ctx.fillStyle = '#FBF8F2'; circle(0, 0, 92); ctx.fill(); noShadow();
    ctx.strokeStyle = 'rgba(34,26,19,.08)'; ctx.lineWidth = 9; circle(0, 0, 74); ctx.stroke();
    ctx.strokeStyle = C.accent; ctx.lineCap = 'round';
    if (p > .005) { ctx.beginPath(); ctx.arc(0, 0, 74, -Math.PI / 2, -Math.PI / 2 + p * TAU); ctx.stroke(); }
    ctx.fillStyle = C.ink;
    for (let k = 0; k < 12; k++) { const a = k / 12 * TAU; circle(Math.cos(a) * 88 * .96, Math.sin(a) * 88 * .96, 1.8); ctx.fill(); }
    const mins = Math.round(p * tm.min);
    text(String(mins).padStart(2, '0'), 0, 16, F.serif(600, 62), C.ink, 'center');
    text(S.min, 0, 46, F.mono(17), C.muted, 'center', 3);
    ctx.restore();
  }
  // indicador de fuego
  const restVis = t > 21 && t < 22.6 ? vis : 0;
  const chipA = Math.max(t > 3 && t < 24 ? clamp(heat * 5) : 0, restVis);
  if (chipA > 0) {
    const lvl = heat > .8 ? 3 : heat > .45 ? 2 : heat > .08 ? 1 : 0;
    ctx.save(); ctx.globalAlpha = chipA;
    for (let k = 0; k < 3; k++) flameIcon(cx - 26 + k * 26, 1615, 1, k < lvl);
    text(S.heat[lvl], cx, 1660, F.mono(18), C.ink, 'center', 3);
    ctx.restore();
  }
}
function drawTitleBlock(t, t0, kicker, withExit) {
  const lt = t - t0;
  if (lt < 0) return;
  const out = withExit ? E.inCubic(prog(t, 2.55, 2.95)) : 0;
  if (out >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(0, -out * 40);
  const ka = E.outCubic(prog(lt, .15, .6));
  ctx.save(); ctx.globalAlpha *= ka; text(kicker, W / 2, 142 + (1 - ka) * 16, F.mono(24), C.accent, 'center', 5); ctx.restore();
  const title = 'MUJADDARA';
  const fs = fitSize([title], s => F.serif(600, s), 168, 900);
  ctx.font = F.serif(600, fs); if (HAS_LS) ctx.letterSpacing = '0px';
  const widths = [...title].map(ch => ctx.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 160, W, fs * .95); ctx.clip();
  [...title].forEach((ch, i) => {
    const e = E.outExpo(prog(lt, .25 + i * .05, .95 + i * .05));
    text(ch, x, 160 + fs * .78 + (1 - e) * fs, F.serif(600, fs), C.ink);
    x += widths[i];
  });
  ctx.restore();
  const sa = E.outCubic(prog(lt, .85, 1.4));
  ctx.save(); ctx.globalAlpha *= sa; text(S.sub, W / 2, 348 + (1 - sa) * 14, F.serifI(40), C.muted, 'center'); ctx.restore();
  // datos
  S.stats.forEach(([v, l], i) => {
    const e = E.outCubic(prog(lt, 1.05 + i * .12, 1.6 + i * .12));
    const x = 240 + i * 300;
    ctx.save(); ctx.globalAlpha *= e;
    text(v, x, 1500 + (1 - e) * 24, F.serif(600, 78), C.ink, 'center');
    text(l, x, 1552 + (1 - e) * 24, F.mono(19), C.muted, 'center', 3);
    ctx.restore();
    if (i) { ctx.save(); ctx.globalAlpha *= e; ctx.fillStyle = C.faint; ctx.fillRect(x - 150, 1440, 2, 124); ctx.restore(); }
  });
  if (!withExit) {
    const ea = E.outCubic(prog(lt, 1.4, 1.9));
    ctx.save(); ctx.globalAlpha *= ea; text(S.enjoy, W / 2, 1668 + (1 - ea) * 16, F.serifI(46), C.accent, 'center'); ctx.restore();
  }
  ctx.restore();
}
function drawTimeline(t) {
  const x0 = 90, total = 900, gap = 8, y = 1826, n = SEGS.length - 1;
  const usable = total - gap * (n - 1);
  let x = x0, cur = 0, headX = x0;
  for (let i = 0; i < n; i++) {
    const a = SEGS[i], b = SEGS[i + 1], w = (b - a) / DUR * usable, p = prog(t, a, b);
    ctx.fillStyle = 'rgba(34,26,19,.12)'; ctx.beginPath(); ctx.roundRect(x, y - 3, w, 6, 3); ctx.fill();
    if (p > 0) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(x, y - 3, Math.max(6, w * p), 6, 3); ctx.fill(); }
    if (t >= a && (t < b || i === n - 1)) { cur = i; headX = x + w * p; }
    x += w + gap;
  }
  ctx.fillStyle = '#FBF8F2'; circle(headX, y, 12); ctx.fill();
  ctx.fillStyle = C.accent; circle(headX, y, 7); ctx.fill();
  const fmt = v => `00:${String(Math.min(30, Math.floor(v))).padStart(2, '0')}`;
  text(S.segs[cur].toUpperCase(), x0, 1790, F.mono(21), C.ink, 'left', 3);
  text(`${fmt(t)} / 00:30`, x0 + total, 1790, F.mono(21), C.muted, 'right', 2);
}

// ─────────────────────────── frame ───────────────────────────
function render(t) {
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; noShadow();
  ctx.drawImage(BG, 0, 0);
  drawStage(t);
  drawHeader(t);
  drawCards(t);
  drawTimerWidget(t);
  drawTitleBlock(t, 0, S.kicker, true);
  if (t >= 28) drawTitleBlock(t, 28, S.ready, false);
  drawTimeline(t);
}

// ─────────────────────────── reproducción ───────────────────────────
const stateEl = document.getElementById('state'), glyph = document.getElementById('glyph');
const fixedT = qs.has('t') ? parseFloat(qs.get('t')) : null;
const LOOP = qs.get('loop') === '1';
let now = 0, playing = fixedT === null, last = null, scrubbing = false, wasPlaying = false;

function showState() {
  const ended = now >= DUR;
  glyph.textContent = ended ? '↻' : '▶';
  stateEl.classList.toggle('on', !playing && !scrubbing && fixedT === null);
}
function tick(ts) {
  if (playing && !scrubbing) {
    if (last !== null) now += Math.min(.1, (ts - last) / 1000);
    if (now >= DUR) { if (LOOP) now = 0; else { now = DUR; playing = false; showState(); } }
  }
  last = ts;
  render(now);
  requestAnimationFrame(tick);
}
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
const seek = x => { now = clamp((x - 90) / 900) * DUR; };
cv.addEventListener('pointerdown', e => {
  const [x, y] = toCanvas(e);
  if (y > 1745) { scrubbing = true; wasPlaying = playing || now >= DUR; cv.setPointerCapture(e.pointerId); seek(x); showState(); return; }
  if (now >= DUR) { now = 0; playing = true; } else playing = !playing;
  showState();
});
cv.addEventListener('pointermove', e => { if (scrubbing) seek(toCanvas(e)[0]); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; playing = wasPlaying && now < DUR; showState(); };
cv.addEventListener('pointerup', endScrub);
cv.addEventListener('pointercancel', endScrub);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (now >= DUR) now = 0; playing = !playing; }
  else if (e.code === 'ArrowRight') now = Math.min(DUR, now + 1);
  else if (e.code === 'ArrowLeft') now = Math.max(0, now - 1);
  else if (e.code === 'KeyR' || e.code === 'Home') { now = 0; playing = true; }
  showState();
});

window.renderFrame = t => { playing = false; now = t; render(t); };
window.DURATION = DUR;

const fontsReady = document.fonts ? Promise.all([
  '600 20px Fraunces', 'italic 400 20px Fraunces', '700 20px Grotesk', '500 20px Grotesk', '700 20px Mono',
].map(f => document.fonts.load(f))).catch(() => {}) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  if (fixedT !== null) { now = clamp(fixedT, 0, DUR); render(now); window.__ready = true; return; }
  window.__ready = true;
  requestAnimationFrame(tick);
});
})();
</script>
